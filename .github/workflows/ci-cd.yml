name: CI/CD RefCard01

# Wann läuft die Pipeline?
on:
  push:
    branches: [main]     # bei jedem Push auf main
  workflow_dispatch:      # und manuell über den Button "Run workflow"

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/refcard01
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI: bauen und testen ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Mit Maven bauen und Unit-Tests ausführen
        run: mvn -B verify

  # ---------- CD: Image bauen, prüfen und veröffentlichen ----------
  docker:
    needs: test            # läuft nur, wenn der Job "test" grün ist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # nötig, damit GITHUB_TOKEN nach ghcr.io pushen darf
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image für den Test bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                 # Image lokal im Runner verfügbar machen
          tags: refcard01:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image testen (Container starten und Webseite abrufen)
        run: |
          docker run -d --name refcard01 -p 8080:8080 refcard01:test
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/ | grep -q "Application Ref. Card 01"; then
              echo "Container antwortet korrekt."
              exit 0
            fi
            sleep 2
          done
          echo "Container hat nicht rechtzeitig geantwortet."
          docker logs refcard01
          exit 1

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bei GitHub Container Registry (ghcr.io) anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags für beide Registries erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Image nach Docker Hub und ghcr.io pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
